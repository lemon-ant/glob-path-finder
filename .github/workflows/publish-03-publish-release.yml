name: 03-Publish Release

# Triggered only after the full compatibility-test matrix (02) completes
# successfully, which itself waits for the build (01) to succeed first.
# This enforces the correct 01 → 02 → 03 sequence and prevents publishing
# before both build and compat checks have passed.
on:
  workflow_run:
    workflows: ["02-Compatibility Test"]
    types: [ completed ]

# One concurrency slot per release commit.
# Do not cancel in-progress publishes: a partial upload to Maven Central
# can leave the deployment in an inconsistent state.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # ── Step 1 ─────────────────────────────────────────────────────────────────
  # Determine whether the completed compat-test run belongs to a release chain
  # (i.e. a v* tag exists for the tested commit) and locate the matching build
  # run so we can download the already-validated artifacts from it.
  detect-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      is-release: ${{ steps.find-tag.outputs.is-release }}
      version: ${{ steps.find-tag.outputs.version }}
      build-run-id: ${{ steps.find-build.outputs.run-id }}
    steps:
      - name: Check for a release tag at the tested commit
        id: find-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          REPO="${{ github.repository }}"

          # repos/REPO/tags returns the actual commit SHA (dereferenced for
          # annotated tags), so this works for both tag types.
          TAG=$(gh api "repos/$REPO/tags" --paginate \
            --jq ".[] | select(.commit.sha == \"$SHA\" and (.name | startswith(\"v\"))) | .name" \
            | head -1)

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            echo "Release tag: $TAG  version: $VERSION"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No release tag found for commit $SHA – push-to-main run; skipping publish."
            echo "is-release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate the successful build run for this commit
        id: find-build
        if: ${{ steps.find-tag.outputs.is-release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          REPO="${{ github.repository }}"

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "publish-01-build.yml" \
            --json databaseId,headSha,conclusion \
            --limit 20 | \
            jq -r ".[] | select(.headSha == \"$SHA\" and .conclusion == \"success\") | .databaseId" \
            | head -1)

          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build run found for commit $SHA"
            exit 1
          fi
          echo "Build run ID: $RUN_ID"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  # ── Step 2 ─────────────────────────────────────────────────────────────────
  # Download the artifact that was built in 01 and validated in 02, sign it
  # with GPG, and publish the resulting bundle to Maven Central – without
  # rebuilding from source.
  publish-release:
    needs: detect-release
    if: ${{ needs.detect-release.outputs.is-release == 'true' }}
    runs-on: ubuntu-latest
    # Expose credentials for GPG signing and Maven Central authentication.
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Download pre-built dist from the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh run download "${{ needs.detect-release.outputs.build-run-id }}" \
            --repo "${{ github.repository }}" \
            --name "gpf-dist" \
            --dir dist
          echo "Downloaded distribution:" && ls -l dist

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign artifacts and assemble Maven Central bundle
        run: |
          VERSION="${{ needs.detect-release.outputs.version }}"
          GROUP_PATH="io/github/lemon-ant"
          ARTIFACT_ID="glob-path-finder"
          BUNDLE_DIR="bundle/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}"
          mkdir -p "$BUNDLE_DIR"

          # Rename the generic pom.xml to the versioned name Central expects.
          cp dist/pom.xml "$BUNDLE_DIR/${ARTIFACT_ID}-${VERSION}.pom"

          # Place all three JARs with the versioned names Central expects.
          MAIN_JAR=$(ls dist/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar' | head -n1)
          cp "$MAIN_JAR"        "$BUNDLE_DIR/${ARTIFACT_ID}-${VERSION}.jar"
          cp dist/*-sources.jar "$BUNDLE_DIR/${ARTIFACT_ID}-${VERSION}-sources.jar"
          cp dist/*-javadoc.jar "$BUNDLE_DIR/${ARTIFACT_ID}-${VERSION}-javadoc.jar"

          # Sign POM and all three JARs with GPG (produces .asc sidecar files).
          for f in "$BUNDLE_DIR"/*.pom "$BUNDLE_DIR"/*.jar; do
            echo "$MAVEN_GPG_PASSPHRASE" | gpg --batch --yes --armor --detach-sign \
              --pinentry-mode loopback --passphrase-fd 0 "$f"
          done

          echo "Bundle contents:"
          ls -lR bundle/

          # Pack into a single ZIP for the Central Portal upload API.
          (cd bundle && zip -r ../bundle.zip .)
          echo "Bundle size: $(ls -lh bundle.zip)"

      - name: Publish to Maven Central
        # Central Portal REST API: Bearer token = base64(username:token).
        # publishingType=USER_MANAGED keeps the same manual-review behaviour
        # that was previously configured via central-publishing-maven-plugin
        # (autoPublish was not set to true).
        run: |
          VERSION="${{ needs.detect-release.outputs.version }}"
          TOKEN=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_TOKEN" | base64 -w0)

          RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://central.sonatype.com/api/v1/publisher/upload?name=glob-path-finder-${VERSION}&publishingType=USER_MANAGED" \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@bundle.zip")

          echo "Deployment response: $RESPONSE"
